<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Dashboard – Data Insights</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav>
    <div class="container nav-container">
        <div class="logo">SPORTS<span>NEWS</span></div>
        <ul class="nav-links">
            <li><a href="index.html" >Home</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="match-center.html">Match Center</a></li>
            <li><a href="calendar.html">Schedule</a></li>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="multimedia.html">Multimedia</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
        <div class="nav-actions">
            <a href="login.html" class="btn-login">Login</a>
            <button id="theme-toggle" class="theme-btn">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>
</nav>
    <main class="container pt-4">
        <div class="section-header">
            <h1>Analytics Dashboard</h1>
            <div class="team-selector">
                <label for="teamSelect">Select Team:</label>
                <select id="teamSelect" class="custom-select">
                    <option value="ahly">Al Ahly</option>
                    <option value="madrid">Real Madrid</option>
                    <option value="barca">Barcelona</option>
                </select>
            </div>
        </div>

        <section class="cards dashboard-kpis">
            <div class="card kpi-card">
                <div class="kpi-icon"><i class="fas fa-trophy"></i></div>
                <div>
                    <h2 id="winRate">75%</h2>
                    <p>Win Rate</p>
                </div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-icon"><i class="fas fa-futbol"></i></div>
                <div>
                    <h2 id="totalGoals">120</h2>
                    <p>Goals Scored</p>
                </div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-icon"><i class="fas fa-shield-alt"></i></div>
                <div>
                    <h2 id="cleanSheets">12</h2>
                    <p>Clean Sheets</p>
                </div>
            </div>
        </section>

        <div class="dashboard-grid mt-4">
            <div class="card chart-container">
                <h3>Performance Overview</h3>
                <canvas id="performanceChart"></canvas>
            </div>
            <div class="card chart-container">
                <h3>Goal Distribution</h3>
                <canvas id="goalsPieChart"></canvas>
            </div>
        </div>
    </main>


<footer style="width: 100%; background-color: var(--color-secondary); color: #fff; text-align: center; padding: 20px; margin-top: 50px; box-sizing: border-box;">
    <p style="color: #fff; margin: 0;">
        &copy; 2025 HNU Sports News. All rights reserved.
    </p>
    <div style="display: flex; justify-content: center; gap: 30px; margin-top: 10px;">
        <a href="feedback.html"
           style="color: #fff; text-decoration: underline; font-weight: 500;">
           Feedback
        </a>
        <a href="contact.html"
           style="color: #fff; text-decoration: underline; font-weight: 500;">
           Contact
        </a>
    </div>
</footer>
</body>
<script src="../js/dashboard.js"></script>
</html>
