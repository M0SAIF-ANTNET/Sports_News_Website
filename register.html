<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Sports News</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="card-header">
                <h1>Create account</h1>
                <p>Join us — it only takes a moment</p>
            </div>

            <form class="register-form">
                <div class="form-group">
                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Jane Smith" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" required>
                    </div>
                    <div class="field">
                        <label for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="card-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="../js/validation.js"></script>

</body>
</html>
