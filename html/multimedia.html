<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia – Sports News</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="container">
        <h1 class="mb-3">Sports Multimedia</h1>

        <!-- Team Logos Grid -->
        <div class="cards">
            <div class="card">
                <img src="../images/al_ahly_eg.png" alt="Al Ahly Egypt" class="team-logo">
                <h3>Al Ahly Egypt</h3>
            </div>
            <div class="card">
                <img src="../images/el_zamalek.png" alt="El Zamalek" class="team-logo">
                <h3>El Zamalek</h3>
            </div>
            <div class="card">
                <img src="../images/al_nasr.png" alt="Al Nassr" class="team-logo">
                <h3>Al Nassr</h3>
            </div>
            <div class="card">
                <img src="../images/al_ahly_sa.png" alt="Al Ahly Saudi" class="team-logo">
                <h3>Al Ahly Saudi</h3>
            </div>
            <div class="card">
                <img src="../images/barcelona.png" alt="Barcelona" class="team-logo">
                <h3>Barcelona</h3>
            </div>
            <div class="card">
                <img src="../images/real_madrid.png" alt="Real Madrid" class="team-logo">
                <h3>Real Madrid</h3>
            </div>
        </div>

        <!-- Videos -->
        <h2 class="mt-4">Videos</h2>
        <div class="cards">
            <div class="card">
                <a href="https://youtu.be/H8M2K5ESxd8" target="_blank" rel="noopener">
                    <img src="https://img.youtube.com/vi/H8M2K5ESxd8/maxresdefault.jpg" alt="Match Highlights">
                </a>
                <h3>Match Highlights</h3>
                <a href="https://youtu.be/H8M2K5ESxd8" target="_blank" rel="noopener" class="btn">Watch Video</a>
            </div>
            <div class="card">
                <a href="https://youtu.be/J2PPhxLLtX8" target="_blank" rel="noopener">
                    <img src="https://img.youtube.com/vi/J2PPhxLLtX8/maxresdefault.jpg" alt="Sports Highlights">
                </a>
                <h3>Match Highlights</h3>
                <a href="https://youtu.be/J2PPhxLLtX8" target="_blank" rel="noopener" class="btn">Watch Video</a>
            </div>
        </div>
    </div>

</body>
</html>
