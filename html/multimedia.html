<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>

    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/components.css">
    <link rel="stylesheet" href="CSS/responsive.css">
</head>
<body>

<div class="container">

    <h1 class="mb-3">Sports Multimedia</h1>

    <!-- Images Grid -->
    <div class="cards">

        <div class="card">
            <img src="Images/al_ahly_eg.png" alt="Al Ahly Egypt" class="team-logo">
            <h3>Al Ahly Egypt</h3>
        </div>

        <div class="card">
            <img src="Images/el_zamalek.png" alt="El Zamalek" class="team-logo">
            <h3>El Zamalek</h3>
        </div>

        <div class="card">
            <img src="Images/al_nassr.png" alt="Al Nassr" class="team-logo">
            <h3>Al Nassr</h3>
        </div>

        <div class="card">
            <img src="Images/al_ahly_sa.png" alt="Al Ahly Saudi" class="team-logo">
            <h3>Al Ahly Saudi</h3>
        </div>

        <div class="card">
            <img src="Images/barcelona.png" alt="Barcelona" class="team-logo">
            <h3>Barcelona</h3>
        </div>

        <div class="card">
            <img src="Images/real_madrid.png" alt="Real Madrid" class="team-logo">
            <h3>Real Madrid</h3>
        </div>

    </div>

    <!-- Videos Section -->
    <h2 class="mt-4">Videos</h2>

    <div class="cards">

        <div class="card">
            <iframe width="100%" height="200"
                src="https://www.youtube.com/embed/ysz5S6PUM-U"
                title="Sports Video"
                frameborder="0"
                allowfullscreen>
            </iframe>
        </div>

        <div class="card">
            <iframe width="100%" height="200"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="Sports Highlights"
                frameborder="0"
                allowfullscreen>
            </iframe>
        </div>

    </div>

</div>

</body>
</html>
