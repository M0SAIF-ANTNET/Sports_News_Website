<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profiles – Sports News</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="container nav-container">
            <div class="logo">SPORTS<span>NEWS</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="match-center.html">Match Center</a></li>
                <li><a href="players.html" class="active">Players</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <main class="container pt-4">
        <div class="section-header">
            <h1><i class="fas fa-users"></i> Player Profiles</h1>
            <p>Explore detailed statistics and career highlights of football legends.</p>
        </div>

        <section class="player-grid">
            <a class="player-card" href="profile.html?player=messi">
                <div class="player-img">
                    <img src="../images/Players/Lionel-Messi.webp" alt="Messi">
                    <div class="player-overlay">
                        <span>View Profile</span>
                    </div>
                </div>
                <div class="player-info">
                    <h3>Lionel Messi</h3>
                    <p>Inter Miami | Forward</p>
                </div>
            </a>

            <a class="player-card" href="profile.html?player=ronaldo">
                <div class="player-img">
                    <img src="../images/Players/cristiano.jpg" alt="Ronaldo">
                    <div class="player-overlay">
                        <span>View Profile</span>
                    </div>
                </div>
                <div class="player-info">
                    <h3>Cristiano Ronaldo</h3>
                    <p>Al Nassr | Forward</p>
                </div>
            </a>

            <a class="player-card" href="profile.html?player=neymar">
                <div class="player-img">
                    <img src="../images/Players/neymar.jpg" alt="Neymar">
                    <div class="player-overlay">
                        <span>View Profile</span>
                    </div>
                </div>
                <div class="player-info">
                    <h3>Neymar Jr</h3>
                    <p>Al Hilal | Forward</p>
                </div>
            </a>
        </section>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
