<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Center</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="container">
    <h1 class="mb-3">Match Center</h1>

    <div class="cards">

        <!-- Match 1 -->
        <div class="card match-card">
            <div class="teams">

                <div>
                    <img src="../images/al_ahly_eg.png" alt="Al Ahly Egypt" class="team-logo">
                    <h3>Al Ahly</h3>
                </div>

                <div>
                    <h2>2 - 1</h2>
                    <p>8:00 PM</p>
                </div>

                <div>
                    <img src="../images/el_zamalek.png" alt="El Zamalek" class="team-logo">
                    <h3>Zamalek</h3>
                </div>

            </div>
        </div>

        <!-- Match 2 -->
        <div class="card match-card">
            <div class="teams">

                <div>
                    <img src="../images/al_nasr.png" alt="Al Nassr" class="team-logo">
                    <h3>Al Nassr</h3>
                </div>

                <div>
                    <h2>1 - 1</h2>
                    <p>6:30 PM</p>
                </div>

                <div>
                    <img src="../images/al_ahly_sa.png" alt="Al Ahly Saudi" class="team-logo">
                    <h3>Al Ahly SA</h3>
                </div>

            </div>
        </div>

        <!-- Match 3 -->
        <div class="card match-card">
            <div class="teams">

                <div>
                    <img src="../images/barcelona.png" alt="Barcelona" class="team-logo">
                    <h3>Barcelona</h3>
                </div>

                <div>
                    <h2>3 - 2</h2>
                    <p>10:00 PM</p>
                </div>

                <div>
                    <img src="../images/real_madrid.png" alt="Real Madrid" class="team-logo">
                    <h3>Real Madrid</h3>
                </div>

            </div>
        </div>

        <!-- Match 4 -->
        <div class="card match-card">
            <div class="teams">

                <div>
                    <img src="../images/arsenal.png" alt="Arsenal" class="team-logo">
                    <h3>Arsenal</h3>
                </div>

                <div>
                    <h2>0 - 0</h2>
                    <p>9:15 PM</p>
                </div>

                <div>
                    <img src="../images/liverpool.png" alt="Liverpool" class="team-logo">
                    <h3>Liverpool</h3>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
