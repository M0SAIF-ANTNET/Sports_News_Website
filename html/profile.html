<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile – Sports News</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav>
    <div class="container nav-container">
        <div class="logo">SPORTS<span>NEWS</span></div>
        <ul class="nav-links">
            <li><a href="index.html" >Home</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="match-center.html">Match Center</a></li>
            <li><a href="calendar.html">Schedule</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="multimedia.html">Multimedia</a></li>
            <li><a href="about.html" >About</a></li>
        </ul>
        <div class="nav-actions">
            <a href="login.html" class="btn-login">Login</a>
            <button id="theme-toggle" class="theme-btn">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>
</nav>
    <main class="container pt-4">
        <a href="profiles.html" class="btn btn-outline mb-4"><i class="fas fa-arrow-left"></i> Back to Players</a>

        <div class="player-profile-wrapper">
            <div class="profile-aside">
                <div class="card p-0 overflow-hidden">
                    <img id="img" class="profile-main-img" alt="Player photo">
                    <div class="profile-name-overlay">
                        <h1 id="name"></h1>
                        <p id="position"></p>
                    </div>
                </div>
            </div>

            <div class="profile-content">
                <div class="card">
                    <h3><i class="fas fa-info-circle"></i> Biography</h3>
                    <p id="bio" class="mt-2"></p>
                </div>

                <div class="stats-grid mt-4">
                    <div class="card stat-item">
                        <span class="stat-label">Goals</span>
                        <h2 id="stat-goals">0</h2>
                    </div>
                    <div class="card stat-item">
                        <span class="stat-label">Assists</span>
                        <h2 id="stat-assists">0</h2>
                    </div>
                    <div class="card stat-item">
                        <span class="stat-label">Appearances</span>
                        <h2 id="stat-apps">0</h2>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const players = {
            messi: {
                name: "Lionel Messi",
                position: "Forward | Inter Miami",
                img: "../images/Players/Lionel-Messi.webp",
                bio: "Argentine footballer, considered one of the greatest players in history. He has won a record 8 Ballon d'Or awards and led Argentina to World Cup glory in 2022.",
                stats: { goals: 821, assists: 361, apps: 1047 }
            },
            ronaldo: {
                name: "Cristiano Ronaldo",
                position: "Forward | Al Nassr",
                img: "../images/Players/cristiano.jpg",
                bio: "Portuguese legend known for his incredible work ethic and athleticism. He is the all-time leading goalscorer in official competitions.",
                stats: { goals: 873, assists: 249, apps: 1204 }
            },
            neymar: {
                name: "Neymar Jr",
                position: "Forward | Al Hilal",
                img: "../images/Players/neymar.jpg",
                bio: "Brazilian superstar famous for his elite dribbling and flair. A key player for the Brazilian national team and a Champions League winner.",
                stats: { goals: 436, assists: 248, apps: 709 }
            }
        };

        const params = new URLSearchParams(window.location.search);
        const player = params.get("player");

        if (players[player]) {
            const p = players[player];
            document.getElementById("name").innerText = p.name;
            document.getElementById("position").innerText = p.position;
            document.getElementById("img").src = p.img;
            document.getElementById("bio").innerText = p.bio;
            
            document.getElementById("stat-goals").innerText = p.stats.goals;
            document.getElementById("stat-assists").innerText = p.stats.assists;
            document.getElementById("stat-apps").innerText = p.stats.apps;
        } else {
            window.location.href = 'players.html';
        }
    </script>
<footer style="width: 100%; background-color: var(--color-secondary); color: #fff; text-align: center; padding: 20px; margin-top: 50px; box-sizing: border-box;">
    <p style="color: #fff; margin: 0;">
        &copy; 2025 HNU Sports News. All rights reserved.
    </p>

           style="color: #fff; text-decoration: underline; font-weight: 500;">
           Feedback
        </a>
        <a href="contact.html"
           style="color: #fff; text-decoration: underline; font-weight: 500;">
           Contact
        </a>
    </div>
</footer>
</body>
</html>
